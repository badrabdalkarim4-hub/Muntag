<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen phone editor. Preview stage on top, transport row, centre-playhead timeline (text lane / video lane / audio lane), tool bar or option sheet at the bottom. Committed dark look, like every editing suite. */
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1d2531; --line:#283243; --fg:#e8edf4; --mut:#8c99ac;
  --accent:#3dd6c6; --accent-ink:#04211e; --trk-text:#b49cff; --trk-audio:#f5c451; --danger:#ff7b7b;
  --f-ui:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-brand:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:780px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;flex:none}
.brand{font-family:var(--f-brand);font-weight:600;font-size:19px;display:flex;align-items:center;gap:9px;letter-spacing:.2px}
.logo{width:36px;height:36px;border-radius:50%;background:#fff;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--line)}
.exp{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.exp svg{width:18px;height:18px}

.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}
.frame{position:relative;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#cv{position:relative;z-index:1;width:100%;height:100%;display:block;touch-action:none}
.vh{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.02;pointer-events:none;z-index:0}
#empty{position:absolute;z-index:2;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;color:var(--mut);padding:16px}
#empty button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:500}

.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:none;direction:ltr}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:baseline}
.time b{color:var(--fg);font-weight:500}
.ctl{display:flex;gap:4px;align-items:center;justify-content:center}
.ctl.r{justify-content:flex-end}
.ib{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--fg);border-radius:50%}
.ib svg{width:20px;height:20px}
.ib:disabled{opacity:.3}
.ib:active{background:var(--panel2)}
.ib.play{width:46px;height:46px;background:var(--fg);color:#0d1117}
.ib.play svg{width:22px;height:22px}

.tl{position:relative;height:168px;flex:none;background:var(--panel);border-radius:12px;overflow:hidden}
#sc{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;direction:ltr}
#sc::-webkit-scrollbar{display:none}
#ct{position:relative;height:100%}
.tick{position:absolute;top:0;height:14px;border-left:1px solid var(--line);padding-left:4px;font-size:10px;line-height:14px;color:var(--mut);font-variant-numeric:tabular-nums;pointer-events:none}
.ph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:5}
.ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
.blk{position:absolute;border-radius:7px;overflow:hidden;font-size:11px;display:flex;align-items:center;touch-action:pan-x}
.blk.sel{outline:2px solid #fff;outline-offset:0;touch-action:none;z-index:2}
.blk .lbl{position:relative;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;pointer-events:none}
.blk.clip{top:62px;height:58px;border:1px solid var(--line);background:#222c3a repeat-x left center/auto 100%;align-items:flex-end}
.blk.clip .lbl{padding:2px 6px;background:rgba(0,0,0,.55);border-radius:4px;margin:0 0 4px 4px;font-size:10px;font-variant-numeric:tabular-nums}
.blk.tx{top:26px;height:30px;background:rgba(180,156,255,.22);border:1px solid var(--trk-text);color:#e3dcff}
.blk.au{top:126px;height:30px;background:rgba(245,196,81,.18);border:1px solid var(--trk-audio);color:#ffe9b0;
  background-image:repeating-linear-gradient(90deg,rgba(245,196,81,.35) 0 2px,transparent 2px 6px);background-size:100% 40%;background-repeat:no-repeat;background-position:center}
.trb{position:absolute;right:3px;top:3px;z-index:1;font-size:11px;line-height:1;background:var(--trk-text);color:#10131a;border-radius:4px;padding:2px 5px;pointer-events:none}
.hd{position:absolute;top:0;bottom:0;width:16px;background:#fff;touch-action:none;z-index:3}
.hd::after{content:"";position:absolute;top:30%;bottom:30%;left:6px;width:3px;border-radius:2px;background:#0d1117}
.hd.l{left:0;border-radius:6px 0 0 6px}
.hd.r{right:0;border-radius:0 6px 6px 0}
.addb{position:absolute;top:62px;width:42px;height:58px;border-radius:8px;border:1px dashed var(--accent);background:rgba(61,214,198,.1);color:var(--accent);display:grid;place-items:center}
.addb svg{width:22px;height:22px}

.dock{flex:none;padding-bottom:8px;min-height:74px}
.bar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.tool{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;background:none;border:0;color:var(--fg);font:500 11px var(--f-ui);border-radius:10px}
.tool svg{width:22px;height:22px}
.tool:active{background:var(--panel2)}
.tool.danger{color:var(--danger)}
.sheet{background:var(--panel);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.sheet h3{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.x{width:32px;height:32px;display:grid;place-items:center;background:var(--panel2);border:0;border-radius:50%;color:var(--fg)}
.x svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row output,.lab{font-size:12px;color:var(--mut);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);font:500 13px var(--f-ui)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fl{flex:none;display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--fg);font:500 11px var(--f-ui);padding:0}
.fl .fs{width:52px;height:52px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#ef4444 40%,#3b82f6 70%,#10b981);border:2px solid transparent}
.fl.on .fs{border-color:var(--accent)}
.fl.on{color:var(--accent)}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 15px var(--f-ui);resize:none;-webkit-user-select:text;user-select:text}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);background:#fff;color:#0d1117;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);text-align:center;z-index:30;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(5,8,12,.86);z-index:40;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(100%,380px);display:grid;gap:14px;text-align:center}
.card h2{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--mut);font-size:13px;line-height:1.7}
.qlist{display:grid;gap:8px}
.qopt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit}
.qopt b{font-weight:600;font-size:14px}
.qopt span{grid-column:1;font-size:12px;color:var(--mut)}
.qopt em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:12px;color:var(--mut);direction:ltr;font-variant-numeric:tabular-nums}
.qopt.on{border-color:var(--accent);background:rgba(61,214,198,.12)}
.pb{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--accent);direction:ltr}
.card video{width:100%;max-height:46vh;border-radius:10px;background:#000}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 14px var(--f-ui)}
.btns button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stash{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const RATIOS={'9:16':[720,1280],'16:9':[1280,720],'1:1':[720,720],'4:5':[720,900]};
let QS=720;
const dims=()=>{const [a,b]=RATIOS[S.ratio],k=QS/Math.min(a,b);return [Math.round(a*k/2)*2,Math.round(b*k/2)*2]};
const RATIO_NAMES={'9:16':'طولي 9:16','16:9':'عرضي 16:9','1:1':'مربع 1:1','4:5':'بورتريه 4:5'};
const FILTERS=[
  {k:'none',n:'بدون',f:'none'},
  {k:'vivid',n:'حيوي',f:'saturate(1.5) contrast(1.1)'},
  {k:'warm',n:'دافئ',f:'sepia(.35) saturate(1.3) hue-rotate(-10deg)'},
  {k:'cool',n:'بارد',f:'saturate(1.1) hue-rotate(15deg) brightness(1.05)'},
  {k:'bw',n:'أبيض وأسود',f:'grayscale(1) contrast(1.15)'},
  {k:'vintage',n:'عتيق',f:'sepia(.6) contrast(.95) brightness(1.05)'},
  {k:'fade',n:'باهت',f:'contrast(.85) brightness(1.1) saturate(.8)'},
  {k:'cine',n:'سينمائي',f:'contrast(1.25) brightness(.9) saturate(1.1)'}
];
const TRANS=[['none','بدون'],['fade','تلاشي'],['white','وميض أبيض'],['zoom','تكبير'],['slide','انزلاق'],['spin','دوران'],['blur','ضبابي']];
const FONTS=[{k:'Cairo',n:'كايرو',w:800},{k:'Tajawal',n:'تجوال',w:800},{k:'Readex Pro',n:'ريدكس',w:600}];
const COLORS=['#ffffff','#111111','#3dd6c6','#f5c451','#ff6b6b','#b49cff'];
const filterOf=k=>(FILTERS.find(f=>f.k===k)||FILTERS[0]).f;

const ICON={
  plus:'<path d="M12 5v14M5 12h14"/>',
  split:'<path d="M12 3v18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
  gauge:'<path d="M12 14l4-4M3.3 19a10 10 0 1 1 17.4 0"/>',
  volume:'<path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  ratio:'<rect x="5" y="3" width="14" height="18" rx="2"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',
  undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',
  redo:'<path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/>',
  dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  trans:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- state ---------- */
let S={ratio:'9:16',clips:[],texts:[],audios:[]};
const media=new Map();
let uidn=0;const uid=()=>'i'+(++uidn);
let t=0,total=0,playing=false,last=0,pps=60,pad=150,sel=null,sheet=null,exporting=false,editing=false;
const undoS=[],redoS=[];
const boxes={};
const cv=$('#cv'),ctx=cv.getContext('2d'),sc=$('#sc'),ct=$('#ct'),dock=$('#dock');

const snap=()=>JSON.stringify(S);
function push(){undoS.push(snap());if(undoS.length>60)undoS.shift();redoS.length=0;updateUndo()}
function updateUndo(){$('#undo').disabled=!undoS.length;$('#redo').disabled=!redoS.length}
function undo(){if(!undoS.length)return;redoS.push(snap());S=JSON.parse(undoS.pop());fixSel();refresh()}
function redo(){if(!redoS.length)return;undoS.push(snap());S=JSON.parse(redoS.pop());fixSel();refresh()}
function fixSel(){if(!selObj()){sel=null;if(sheet&&sheet!=='ratio')sheet=null}}
function edit(fn){push();fn();refresh()}

function dur(c){return (c.out-c.in)/c.speed}
function layout(){let s=0;for(const c of S.clips){c.start=s;c.d=dur(c);s+=c.d}total=s}
function tlEnd(){let e=total;for(const x of S.texts)e=Math.max(e,x.start+x.dur);for(const a of S.audios)e=Math.max(e,a.start+(a.out-a.in));return e}
function selObj(){if(!sel)return null;const L=sel.t==='clip'?S.clips:sel.t==='text'?S.texts:S.audios;return L.find(x=>x.id===sel.id)||null}
function clipAt(x){
  if(!S.clips.length)return null;
  for(const c of S.clips){if(x>=c.start&&x<c.start+c.d)return c}
  return S.clips[S.clips.length-1];
}
const srcTime=(c,x)=>c.in+clamp(x-c.start,0,c.d)*c.speed;
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=s-m*60;return String(m).padStart(2,'0')+':'+x.toFixed(1).padStart(4,'0')};

/* ---------- audio graph (needed for export mixing) ---------- */
let AC=null,dest=null,master=null;
function ensureAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    dest=AC.createMediaStreamDestination();
    master=AC.createGain();master.connect(AC.destination);
  }catch(e){AC=null}
}
function nodeFor(m){
  if(!AC)return null;
  if(!m.gain){
    try{
      m.node=AC.createMediaElementSource(m.el);
      m.gain=AC.createGain();
      m.node.connect(m.gain);m.gain.connect(master);m.gain.connect(dest);
    }catch(e){m.gain=null}
  }
  return m.gain||null;
}
function setVol(m,v){
  if(m.gain){m.gain.gain.value=v;m.el.volume=1}else{m.el.volume=clamp(v,0,1)}
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawText(tx,W,H){
  const f=FONTS.find(z=>z.k===tx.font)||FONTS[0];
  const px=tx.size/100*W;
  ctx.font=`${f.w} ${px}px "${f.k}", sans-serif`;
  ctx.direction=/[؀-ۿ]/.test(tx.text)?'rtl':'ltr';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=tx.text.split('\n'),lh=px*1.4,th=lines.length*lh;
  const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));
  const cx=tx.x*W,cy=tx.y*H,top=cy-th/2,pd=px*.35;
  if(tx.bg){ctx.fillStyle='rgba(0,0,0,.6)';rr(cx-mw/2-pd,top-pd*.5,mw+pd*2,th+pd,px*.28);ctx.fill()}
  ctx.fillStyle=tx.color;
  if(!tx.bg){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=px*.2;ctx.shadowOffsetY=px*.05}
  lines.forEach((l,i)=>ctx.fillText(l,cx,top+lh*(i+.5)));
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  boxes[tx.id]={x:cx-mw/2-pd,y:top-pd*.5,w:mw+pd*2,h:th+pd};
  if(!exporting&&sel&&sel.t==='text'&&sel.id===tx.id){
    const b=boxes[tx.id];ctx.save();ctx.setLineDash([12,9]);ctx.lineWidth=3;ctx.strokeStyle='#3dd6c6';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.restore();
  }
}
function frameSrc(m){
  const el=m.el;
  if(m.kind==='image')return el.naturalWidth?{s:el,w:el.naturalWidth,h:el.naturalHeight}:null;
  if(el.readyState>=2&&el.videoWidth)return {s:el,w:el.videoWidth,h:el.videoHeight};
  if(m.timg&&m.timg.naturalWidth)return {s:m.timg,w:m.timg.naturalWidth,h:m.timg.naturalHeight};
  return null;
}
function trState(c,x){
  const i=S.clips.indexOf(c),u=x-c.start,nx=S.clips[i+1],pv=S.clips[i-1];
  if(nx&&c.tr&&c.tr!=='none'){const h=Math.min((c.td||.6)/2,c.d/2);if(h>0&&u>c.d-h)return {k:c.tr,p:(u-(c.d-h))/h,dir:-1}}
  if(pv&&pv.tr&&pv.tr!=='none'){const h=Math.min((pv.td||.6)/2,c.d/2);if(h>0&&u<h)return {k:pv.tr,p:1-u/h,dir:1}}
  return null;
}
function draw(){
  const W=cv.width,H=cv.height;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const c=clipAt(t);
  if(c){
    const f=frameSrc(media.get(c.m));
    if(f){
      const k=c.fit==='contain'?Math.min(W/f.w,H/f.h):Math.max(W/f.w,H/f.h);
      const w=f.w*k,h=f.h*k,tr=trState(c,t);
      let extra='';
      ctx.save();
      if(tr){
        const q=Math.min(1,Math.max(0,tr.p)),p=q*q*(3-2*q);
        switch(tr.k){
          case 'white':ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1-p;break;
          case 'fade':ctx.globalAlpha=1-p;break;
          case 'zoom':ctx.globalAlpha=1-p;ctx.translate(W/2,H/2);ctx.scale(1+p*.7,1+p*.7);ctx.translate(-W/2,-H/2);break;
          case 'slide':ctx.translate(tr.dir*p*W,0);break;
          case 'spin':ctx.globalAlpha=1-p;ctx.translate(W/2,H/2);ctx.rotate(tr.dir*p*Math.PI/2);ctx.scale(1-p*.4,1-p*.4);ctx.translate(-W/2,-H/2);break;
          case 'blur':ctx.globalAlpha=1-p;extra='blur('+(p*W*.03).toFixed(1)+'px)';break;
        }
      }
      const base=filterOf(c.filter),fl=((base==='none'?'':base+' ')+extra).trim();
      ctx.filter=fl||'none';
      try{ctx.drawImage(f.s,(W-w)/2,(H-h)/2,w,h)}catch(_){}
      ctx.restore();
    }
  }
  for(const x of S.texts){if(t>=x.start&&t<x.start+x.dur)drawText(x,W,H)}
}

/* ---------- playback ---------- */
function sync(){
  const want=new Set(),act=clipAt(t);
  if(act){
    const m=media.get(act.m);
    if(m.kind==='video'){
      want.add(m);setVol(m,act.vol);
      const tgt=srcTime(act,t);m.el.playbackRate=act.speed;
      if(playing){
        const drift=Math.abs(m.el.currentTime-tgt);
        if(m.el.paused||drift>.3){
          if(m.el.paused||drift>.05)m.el.currentTime=tgt;
          m.el.play().catch(()=>{});
        }
      }else{
        m.el.pause();
        if(Math.abs(m.el.currentTime-tgt)>.04)m.el.currentTime=tgt;
      }
    }
  }
  for(const a of S.audios){
    const m=media.get(a.m),d=a.out-a.in;
    if(t>=a.start&&t<a.start+d){
      want.add(m);setVol(m,a.vol);
      const tgt=a.in+(t-a.start);
      if(playing){
        if(m.el.paused){m.el.currentTime=tgt;m.el.play().catch(()=>{})}
        else if(Math.abs(m.el.currentTime-tgt)>.3)m.el.currentTime=tgt;
      }else m.el.pause();
    }
  }
  for(const m of media.values()){if(m.kind!=='image'&&!want.has(m)&&!m.el.paused)m.el.pause()}
}
function ui(){
  $('#tcur').textContent=fmt(t);$('#ttot').textContent=fmt(total);
  if(playing||exporting)sc.scrollLeft=t*pps;
  if(exporting){const b=$('#pbar');if(b)b.style.width=(total?Math.min(100,t/total*100):0)+'%'}
}
function render(){sync();draw();ui()}
function setPlayIcon(){$('#pp').innerHTML=ic(playing?'pause':'play');$('#pp').setAttribute('aria-label',playing?'إيقاف مؤقت':'تشغيل')}
function tick(now){
  if(!playing)return;
  t+=(now-last)/1000;last=now;
  if(t>=total){
    t=total;pausePlay();draw();ui();
    if(exporting)finishExport();
    return;
  }
  sync();draw();ui();
  requestAnimationFrame(tick);
}
function play(){
  if(!total)return;
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(t>=total-.05)t=0;
  playing=true;last=performance.now();setPlayIcon();
  requestAnimationFrame(tick);
}
function pausePlay(){playing=false;sync();setPlayIcon()}
const toggle=()=>playing?pausePlay():play();

/* ---------- timeline ---------- */
function positionBlocks(){
  ct.querySelectorAll('.blk').forEach(b=>{
    const id=b.dataset.id,k=b.dataset.k;let s,d;
    if(k==='clip'){const c=S.clips.find(x=>x.id===id);if(!c)return;s=c.start;d=c.d}
    else if(k==='text'){const x=S.texts.find(z=>z.id===id);if(!x)return;s=x.start;d=x.dur}
    else{const a=S.audios.find(z=>z.id===id);if(!a)return;s=a.start;d=a.out-a.in}
    b.style.left=(pad+s*pps)+'px';b.style.width=Math.max(d*pps,10)+'px';
  });
  const ab=$('#addb');if(ab)ab.style.left=(pad+total*pps+8)+'px';
  ct.style.width=(pad*2+tlEnd()*pps+70)+'px';
}
function buildTimeline(){
  pad=(sc.clientWidth||300)/2;
  const end=tlEnd();
  ct.style.width=(pad*2+end*pps+70)+'px';
  ct.textContent='';
  const step=pps>=100?1:pps>=50?2:pps>=26?5:10;
  for(let s=0;s<=Math.ceil(end/step)*step+step;s+=step){
    const e=document.createElement('span');e.className='tick';e.style.left=(pad+s*pps)+'px';
    e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');ct.appendChild(e);
  }
  const mk=(cls,type,o,label)=>{
    const b=document.createElement('div');
    const on=sel&&sel.id===o.id;
    b.className='blk '+cls+(on?' sel':'');b.dataset.k=type;b.dataset.id=o.id;b.dir='auto';
    const sp=document.createElement('span');sp.className='lbl';sp.textContent=label;b.appendChild(sp);
    if(type==='clip'&&o.tr&&o.tr!=='none'&&S.clips.indexOf(o)<S.clips.length-1){const tb=document.createElement('span');tb.className='trb';tb.textContent='⇄';b.appendChild(tb)}
    if(on){
      for(const side of ['l','r']){
        const h=document.createElement('i');h.className='hd '+side;
        h.addEventListener('pointerdown',e=>startDrag(type,o,side,e));b.appendChild(h);
      }
      b.addEventListener('pointerdown',e=>{if(e.target.classList.contains('hd')||type==='clip')return;startDrag(type,o,'move',e)});
    }
    ct.appendChild(b);return b;
  };
  S.clips.forEach(c=>{const b=mk('clip','clip',c,fmt(c.d).slice(3));const m=media.get(c.m);if(m&&m.thumb)b.style.backgroundImage=`url("${m.thumb}")`});
  S.texts.forEach(x=>mk('tx','text',x,x.text.split('\n')[0]));
  S.audios.forEach(a=>mk('au','audio',a,media.get(a.m).name));
  const ab=document.createElement('button');ab.className='addb';ab.id='addb';ab.type='button';
  ab.setAttribute('aria-label','إضافة مقطع');ab.innerHTML=ic('plus');ab.addEventListener('click',()=>$('#fv').click());
  ct.appendChild(ab);
  positionBlocks();
}
function startDrag(type,obj,mode,e){
  e.preventDefault();e.stopPropagation();
  try{e.target.setPointerCapture(e.pointerId)}catch(_){}
  push();
  const x0=e.clientX,o={...obj},mm=media.get(obj.m);
  const mv=ev=>{
    const ds=(ev.clientX-x0)/pps;
    if(type==='clip'){
      if(mode==='l')obj.in=clamp(o.in+ds*o.speed,0,o.out-.2*o.speed);
      else obj.out=clamp(o.out+ds*o.speed,o.in+.2*o.speed,mm.kind==='image'?1e4:mm.dur);
    }else if(type==='text'){
      if(mode==='l'){const ns=clamp(o.start+ds,0,o.start+o.dur-.2);obj.dur=o.dur-(ns-o.start);obj.start=ns}
      else if(mode==='r')obj.dur=Math.max(.2,o.dur+ds);
      else obj.start=Math.max(0,o.start+ds);
    }else{
      if(mode==='l'){const dd=clamp(ds,Math.max(-o.start,-o.in),o.out-o.in-.2);obj.start=o.start+dd;obj.in=o.in+dd}
      else if(mode==='r')obj.out=clamp(o.out+ds,o.in+.2,mm.dur);
      else obj.start=Math.max(0,o.start+ds);
    }
    layout();positionBlocks();render();
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    refresh();
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
ct.addEventListener('click',e=>{
  const b=e.target.closest('.blk');
  if(b&&!e.target.classList.contains('hd')){sel={t:b.dataset.k,id:b.dataset.id};sheet=null;refresh()}
  else if(!b&&!e.target.closest('.addb')){sel=null;sheet=null;refresh()}
});
sc.addEventListener('pointerdown',()=>{if(playing&&!exporting)pausePlay()});
sc.addEventListener('scroll',()=>{
  if(playing||exporting)return;
  const nt=clamp(sc.scrollLeft/pps,0,total);
  if(Math.abs(nt-t)<.002)return;
  t=nt;sync();draw();$('#tcur').textContent=fmt(t);
});

/* ---------- dock: tool bar and option sheets ---------- */
function toolsFor(){
  if(!sel)return [['add','plus','إضافة مقطع'],['text','text','نص'],['audio','music','صوت'],['filter','sparkle','فلتر'],['ratio','ratio','المقاس']];
  if(sel.t==='clip')return [['split','split','تقسيم'],['speed','gauge','السرعة'],['trans','trans','انتقال'],['vol','volume','الصوت'],['filter','sparkle','فلتر'],['fit','fit','ملاءمة'],['dup','copy','تكرار'],['del','trash','حذف']];
  if(sel.t==='text')return [['edit','text','تعديل'],['dup','copy','تكرار'],['del','trash','حذف']];
  return [['vol','volume','الصوت'],['del','trash','حذف']];
}
const head=title=>`<h3><span>${title}</span><button class="x" type="button" data-a="close" aria-label="إغلاق">${ic('x')}</button></h3>`;
function panelHTML(n){

  if(n==='vol'&&o)return `<div class="sheet">${head('مستوى الصوت')}<div class="row"><input id="rg" type="range" min="0" max="200" step="5" value="${Math.round(o.vol*100)}" aria-label="مستوى الصوت"><output id="ro">${Math.round(o.vol*100)}%</output></div></div>`;
  if(n==='filter'&&o)return `<div class="sheet">${head('الفلاتر')}<div class="chips">${FILTERS.map(f=>`<button class="fl ${o.filter===f.k?'on':''}" type="button" data-fl="${f.k}"><span class="fs" style="filter:${f.f}"></span>${f.n}</button>`).join('')}</div><div class="chips"><button class="chip" type="button" data-all="1">تطبيق على كل المقاطع</button></div></div>`;
  if(n==='trans'&&o)return `<div class="sheet">${head('الانتقال إلى المقطع التالي')}<div class="chips">${TRANS.map(([k,l])=>`<button class="chip ${(o.tr||'none')===k?'on':''}" type="button" data-tr="${k}">${l}</button>`).join('')}</div><div class="row"><span class="lab">المدة</span><input id="rg" type="range" min="0.3" max="1.5" step="0.1" value="${o.td||.6}" aria-label="مدة الانتقال"><output id="ro">${(o.td||.6).toFixed(1)} ث</output></div><div class="chips"><button class="chip" type="button" data-trall="1">تطبيق على كل المقاطع</button></div></div>`;
  if(n==='ratio')return `<div class="sheet">${head('مقاس الفيديو')}<div class="chips">${Object.keys(RATIOS).map(k=>`<button class="chip ${S.ratio===k?'on':''}" type="button" data-ra="${k}">${RATIO_NAMES[k]}</button>`).join('')}</div></div>`;
  if(n==='text'&&o)return `<div class="sheet">${head('تعديل النص')}<textarea id="tx" rows="2" dir="auto" placeholder="اكتب النص هنا" aria-label="النص"></textarea><div class="row"><span class="lab">الحجم</span><input id="sz" type="range" min="3" max="20" step="0.5" value="${o.size}" aria-label="حجم الخط"><output id="ro">${o.size}</output></div><div class="chips">${FONTS.map(f=>`<button class="chip ${o.font===f.k?'on':''}" type="button" data-fn="${f.k}" style="font-family:'${f.k}'">${f.n}</button>`).join('')}<button class="chip ${o.bg?'on':''}" type="button" data-bg="1">خلفية</button></div><div class="chips">${COLORS.map(c=>`<button class="sw ${o.color===c?'on':''}" type="button" data-col="${c}" style="background:${c}" aria-label="لون ${c}"></button>`).join('')}</div></div>`;
  return '';
}
function renderDock(){
  if(sheet&&!(sheet==='ratio'||selObj()))sheet=null;
  if(sheet){
    dock.innerHTML=panelHTML(sheet);
    const tx=$('#tx');if(tx&&selObj())tx.value=selObj().text.trim()===''?'':selObj().text;
    return;
  }
  dock.innerHTML='<div class="bar">'+toolsFor().map(([a,i,l])=>`<button class="tool ${a==='del'?'danger':''}" type="button" data-a="${a}">${ic(i)}<span>${l}</span></button>`).join('')+'</div>';
}
function needClip(){
  if(sel&&sel.t==='clip')return true;
  const c=clipAt(t);if(!c){toast('أضف مقطعاً أولاً');return false}
  sel={t:'clip',id:c.id};return true;
}
function act(a){
  const o=selObj();
  switch(a){
    case 'close':sheet=null;renderDock();break;
    case 'add':$('#fv').click();break;
    case 'audio':$('#fa').click();break;
    case 'text':addText();break;
    case 'edit':sheet='text';renderDock();break;
    case 'ratio':sheet='ratio';renderDock();break;
    case 'filter':if(needClip()){sheet='filter';buildTimeline();renderDock()}break;
    case 'speed':if(o&&media.get(o.m).kind==='image'){toast('السرعة للفيديو فقط. اسحب حافة المقطع لتغيير مدته')}else{sheet='speed';renderDock()}break;
    case 'vol':if(o&&sel.t==='clip'&&media.get(o.m).kind==='image'){toast('الصورة لا تحتوي صوتاً')}else{sheet='vol';renderDock()}break;
    case 'trans':{const i=S.clips.indexOf(o);if(i<0||i>=S.clips.length-1){toast('الانتقال يكون بين مقطعين. اختر مقطعاً ليس الأخير')}else{sheet='trans';renderDock()}break}
    case 'split':split();break;
    case 'fit':if(o)edit(()=>{o.fit=o.fit==='contain'?'cover':'contain'});break;
    case 'dup':dup();break;
    case 'del':del();break;
  }
}
dock.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const D=b.dataset,o=selObj();
  if(D.a){act(D.a);return}

  else if(D.tr){edit(()=>{o.tr=D.tr});if(D.tr!=='none'){t=Math.max(0,o.start+o.d-(o.td||.6)/2-.6);sc.scrollLeft=t*pps;play()}}
  else if(D.trall)edit(()=>{S.clips.forEach(c=>{c.tr=o.tr||'none';c.td=o.td||.6})});
  else if(D.fl)edit(()=>{o.filter=D.fl});
  else if(D.all)edit(()=>{S.clips.forEach(c=>{c.filter=o.filter})});
  else if(D.col)edit(()=>{o.color=D.col});

dock.addEventListener('input',e=>{

dock.addEventListener('change',()=>{editing=false;refresh(true)});

/* ---------- editing actions ---------- */
function split(){
  const c=sel&&sel.t==='clip'?S.clips.find(x=>x.id===sel.id):clipAt(t);
  if(!c){toast('لا يوجد مقطع للتقسيم');return}
  const off=t-c.start;
  if(off<.15||off>c.d-.15){toast('ضع المؤشر داخل المقطع ثم اضغط تقسيم');return}
  edit(()=>{
    const at=c.in+off*c.speed,n={...c,id:uid(),in:at};
    n.tr=c.tr;n.td=c.td;c.tr='none';c.out=at;S.clips.splice(S.clips.indexOf(c)+1,0,n);sel={t:'clip',id:n.id};
  });
}
function del(){
  if(!sel)return;
  edit(()=>{
    const L=sel.t==='clip'?S.clips:sel.t==='text'?S.texts:S.audios;
    const i=L.findIndex(x=>x.id===sel.id);if(i>=0)L.splice(i,1);
    sel=null;sheet=null;
  });
}
function dup(){
  const o=selObj();if(!o)return;
  edit(()=>{
    const n={...o,id:uid()};delete n.sample;
    if(sel.t==='clip'){S.clips.splice(S.clips.indexOf(o)+1,0,n)}
    else{n.start=o.start+o.dur;S.texts.push(n)}
    sel={t:sel.t,id:n.id};
  });
}
function addText(){
  edit(()=>{
    const x={id:uid(),text:'اكتب هنا',start:t,dur:3,x:.5,y:.5,size:9,color:'#ffffff',font:'Cairo',bg:false};
    S.texts.push(x);sel={t:'text',id:x.id};sheet='text';
  });
}

/* drag text on the preview */
cv.addEventListener('pointerdown',e=>{
  if(exporting)return;
  const r=cv.getBoundingClientRect(),W=cv.width,H=cv.height;
  const px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  const hit=[...S.texts].reverse().find(x=>{const b=boxes[x.id];return b&&t>=x.start&&t<x.start+x.dur&&px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h});
  if(!hit){if(sel&&sel.t==='text'){sel=null;sheet=null;refresh()}return}
  e.preventDefault();
  if(!(sel&&sel.id===hit.id)){sel={t:'text',id:hit.id};sheet=null;refresh()}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  push();
  const ox=hit.x-px/W,oy=hit.y-py/H;
  const mv=ev=>{
    const rx=(ev.clientX-r.left)/r.width,ry=(ev.clientY-r.top)/r.height;
    hit.x=clamp(rx+ox,.05,.95);hit.y=clamp(ry+oy,.04,.96);draw();
  };
  const up=()=>{cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up)};
  cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
});

/* ---------- importing media ---------- */
const stash=$('#stash');
function loadVideo(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),v=document.createElement('video');
    v.className='vh';v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    v.preload='auto';v.muted=true;v.src=url;$('#frame').appendChild(v);
    let ok=false;
    const fin=()=>{if(ok)return;ok=true;clearTimeout(to);v.muted=false;res({el:v,url,dur:v.duration})};
    const fail=()=>{if(ok)return;ok=true;clearTimeout(to);rej(new Error('bad'))};
    const to=setTimeout(fail,20000);
    v.onerror=fail;
    v.onloadedmetadata=()=>{
      if(!(isFinite(v.duration)&&v.duration>0)){fail();return}
      const done=()=>{if(ok)return;try{v.pause();v.currentTime=0}catch(_){}fin()};
      v.addEventListener('loadeddata',()=>setTimeout(done,80),{once:true});
      setTimeout(done,5000);
      const p=v.play();if(p&&p.catch)p.catch(()=>{});
    };
  });
}
async function thumbOf(v){
  try{
    v.currentTime=Math.min(.1,v.duration/2);
    await new Promise(r=>{v.addEventListener('seeked',r,{once:true});setTimeout(r,1500)});
    const h=96,w=Math.round(h*(v.videoWidth||9)/(v.videoHeight||16)),c=document.createElement('canvas');
    c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return c.toDataURL('image/jpeg',.6);
  }catch(_){return ''}
}
function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>res({el:img,url});img.onerror=()=>rej(new Error('bad'));img.src=url;
  });
}
async function addFiles(files){
  toast('جارٍ الاستيراد…',60000);
  const made=[];
  for(const f of files){
    try{
      let m;
      if(f.type.startsWith('video/')){
        const r=await loadVideo(f);
        m={kind:'video',el:r.el,url:r.url,dur:r.dur,name:f.name};
        m.thumb=await thumbOf(r.el);if(m.thumb){m.timg=new Image();m.timg.src=m.thumb}
        r.el.addEventListener('seeked',()=>{if(!playing)draw()});
      }else if(f.type.startsWith('image/')){
        const r=await loadImage(f);
        m={kind:'image',el:r.el,url:r.url,thumb:r.url,name:f.name};
      }else continue;
      const mid=uid();media.set(mid,m);
      made.push({id:uid(),m:mid,in:0,out:m.kind==='image'?3:m.dur,speed:1,vol:1,filter:'none',fit:'cover',tr:'none',td:.6});
    }catch(_){toast('تعذّر فتح الملف: '+f.name)}
  }
  if(!made.length){hideToast();return}
  edit(()=>{
    if(S.clips.length&&S.clips.every(c=>media.get(c.m).sample)){S.clips=[];S.texts=S.texts.filter(x=>!x.sample)}
    S.clips.push(...made);sel={t:'clip',id:made[0].id};sheet=null;
  });
  t=made[0].start;sc.scrollLeft=t*pps;render();hideToast();
}
async function addAudio(file){
  toast('جارٍ الاستيراد…',60000);
  try{
    const url=URL.createObjectURL(file),a=new Audio();a.preload='auto';a.src=url;
    await new Promise((res,rej)=>{a.onloadedmetadata=res;a.onerror=()=>rej(new Error('bad'));setTimeout(()=>rej(new Error('timeout')),15000)});
    if(!isFinite(a.duration))throw new Error('duration');
    const mid=uid();media.set(mid,{kind:'audio',el:a,url,dur:a.duration,name:file.name});
    edit(()=>{const n={id:uid(),m:mid,start:t,in:0,out:a.duration,vol:1};S.audios.push(n);sel={t:'audio',id:n.id};sheet=null});
    hideToast();
  }catch(_){toast('تعذّر فتح الملف الصوتي')}
}
$('#fv').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)addFiles(f)});
$('#fa').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)addAudio(f)});
$('#emptyadd').addEventListener('click',()=>$('#fv').click());

/* ---------- export ---------- */
let rec=null,chunks=[],cancelled=false,DL=null,resultUrl='';
(async()=>{try{const cl=window.claude;DL=cl&&cl.use?await cl.use('downloads'):null}catch(_){DL=null}})();
const ov=$('#ov');
function showProg(){
  ov.hidden=false;
  ov.innerHTML=`<div class="card"><h2>جارٍ تصدير الفيديو</h2><div class="pb"><i id="pbar"></i></div><p>يتم التسجيل بسرعة التشغيل الحقيقية، فأبقِ هذه الصفحة مفتوحة حتى ينتهي.</p><div class="btns"><button type="button" id="cx">إلغاء</button></div></div>`;
  $('#cx').addEventListener('click',()=>{cancelled=true;exporting=false;playing=false;if(rec&&rec.state!=='inactive')rec.stop();else hideOv();setPlayIcon();sync()});
}
function hideOv(){ov.hidden=true;ov.innerHTML='';if(resultUrl){URL.revokeObjectURL(resultUrl);resultUrl=''}}
async function startExport(short,bps){
  if(!total){toast('أضف مقطعاً أولاً');return}
  if(!window.MediaRecorder||!cv.captureStream){hideOv();toast('هذا المتصفح لا يدعم التصدير');return}
  pausePlay();ensureAudio();
  try{if(AC)await AC.resume()}catch(_){}
  if(AC&&AC.state!=='running')toast('تعذّر تشغيل الصوت. قد يخرج الفيديو بدون صوت',3500);
  for(const m of media.values()){if(m.kind!=='image')nodeFor(m)}
  const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  sel=null;sheet=null;exporting=true;cancelled=false;
  QS=short;sizeStage();
  buildTimeline();renderDock();
  if(master)master.gain.value=0;
  const stream=cv.captureStream(30);
  if(dest)dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps})}
  catch(_){
    try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}
    catch(__){exporting=false;if(master)master.gain.value=1;QS=720;sizeStage();draw();hideOv();toast('تعذّر بدء التصدير بهذه الجودة');return}
  }
  rec.onerror=()=>{cancelled=true;exporting=false;pausePlay();toast('فشل الترميز بهذه الجودة. جرّب جودة أقل');try{if(rec.state!=='inactive')rec.stop()}catch(_){}};
  chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>endExport(mime||rec.mimeType);
  showProg();
  t=0;sc.scrollLeft=0;sync();draw();
  await new Promise(r=>setTimeout(r,350));
  if(cancelled)return;
  rec.start(500);play();
}
function finishExport(){setTimeout(()=>{if(rec&&rec.state!=='inactive')rec.stop()},250)}
function endExport(mime){
  const dm=cv.width+'×'+cv.height;
  exporting=false;if(master)master.gain.value=1;
  QS=720;sizeStage();draw();
  if(cancelled){hideOv();return}
  const type=(mime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type});
  resultUrl=URL.createObjectURL(blob);
  const name='badr-video.'+ext;
  const canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File([blob],name,{type:blob.type})]}));
  const warn=ext==='webm'?'<p>هذا الجهاز أنتج صيغة WebM، وبعض تطبيقات الاستوديو لا تعرضها. جرّب «مشاركة» ثم اختر الاستوديو أو أي تطبيق فيديو.</p>':'';
  ov.innerHTML=`<div class="card"><h2>الفيديو جاهز</h2><video src="${resultUrl}" controls playsinline></video><p>الصيغة ${ext.toUpperCase()} · ${dm} · ${(blob.size/1048576).toFixed(1)} ميغابايت</p>${warn}<div class="btns"><button type="button" id="rc">إغلاق</button>${canShare?'<button type="button" id="rh">مشاركة</button>':''}<button type="button" class="pri" id="rs">حفظ</button></div></div>`;
  $('#rc').addEventListener('click',hideOv);
  $('#rs').addEventListener('click',async()=>{
    try{
      if(DL){await DL.save({filename:name,data:blob});toast('تم الحفظ')}
      else{dlBlob(name);toast('بدأ التنزيل. ستجده في مجلد التنزيلات (Downloads)',4000)}
    }catch(err){if(!(err&&err.code==='declined'))toast('تعذّر الحفظ. جرّب زر المشاركة')}
  });
  const rh=$('#rh');
  if(rh)rh.addEventListener('click',async()=>{
    try{await navigator.share({files:[new File([blob],name,{type:blob.type})]})}
    catch(err){if(!(err&&err.name==='AbortError'))toast('تعذّرت المشاركة. جرّب زر الحفظ')}
  });
  t=0;sc.scrollLeft=0;render();
}
const QUAL=[[480,'480p','جودة منخفضة وملف صغير',2.5e6],[720,'720p HD','مناسب للمشاركة السريعة',5e6],[1080,'1080p Full HD','الأنسب لمعظم المنصات',10e6],[1440,'1440p 2K','جودة عالية',20e6],[2160,'2160p 4K','أعلى جودة، يحتاج هاتفاً قوياً',40e6]];
let qsel=1080;
function openQuality(){
  if(!total){toast('أضف مقطعاً أولاً');return}
  pausePlay();
  const [a,b]=RATIOS[S.ratio];
  const dm=q=>{const k=q/Math.min(a,b);return Math.round(a*k/2)*2+'×'+Math.round(b*k/2)*2};
  ov.hidden=false;
  ov.innerHTML=`<div class="card"><h2>جودة التصدير</h2><div class="qlist">${QUAL.map(([q,n,d])=>`<button type="button" class="qopt ${q===qsel?'on':''}" data-q="${q}"><b>${n}</b><span>${d}</span><em>${dm(q)}</em></button>`).join('')}</div><p>كلما زادت الجودة طال التصدير وكبر الملف. جودة 4K قد لا تعمل على كل الهواتف، وإذا فشلت جرّب جودة أقل.</p><div class="btns"><button type="button" id="qc">إلغاء</button><button type="button" class="pri" id="qg">ابدأ التصدير</button></div></div>`;
  ov.querySelectorAll('.qopt').forEach(b=>b.addEventListener('click',()=>{qsel=+b.dataset.q;ov.querySelectorAll('.qopt').forEach(x=>x.classList.toggle('on',x===b))}));
  $('#qc').addEventListener('click',hideOv);
  $('#qg').addEventListener('click',()=>{const q=QUAL.find(z=>z[0]===qsel);startExport(q[0],q[3])});
}
function dlBlob(name){const a=document.createElement('a');a.href=resultUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('#exp').addEventListener('click',openQuality);

/* ---------- layout, refresh, boot ---------- */
function sizeStage(){
  const st=$('#stage'),[W,H]=RATIOS[S.ratio],aw=st.clientWidth,ah=st.clientHeight;
  if(!aw||!ah)return;
  const k=Math.min(aw/W,ah/H),fr=$('#frame');
  fr.style.width=Math.floor(W*k)+'px';fr.style.height=Math.floor(H*k)+'px';
  const [cw,ch]=dims();if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
}
function refresh(keepDock){
  layout();t=clamp(t,0,total);
  buildTimeline();if(!keepDock)renderDock();
  sizeStage();
  $('#empty').hidden=S.clips.length>0;
  sc.scrollLeft=t*pps;
  sync();draw();ui();updateUndo();
}
let tt=null;
function toast(msg,ms=2400){const e=$('#toast');e.textContent=msg;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},ms)}
function hideToast(){clearTimeout(tt);$('#toast').hidden=true}

$('#pp').addEventListener('click',toggle);
$('#undo').addEventListener('click',undo);
$('#redo').addEventListener('click',redo);
$('#zi').addEventListener('click',()=>{pps=Math.min(200,pps*1.4);buildTimeline();sc.scrollLeft=t*pps});
$('#zo').addEventListener('click',()=>{pps=Math.max(18,pps/1.4);buildTimeline();sc.scrollLeft=t*pps});
$('#expi').innerHTML=ic('dl');
$('#undo').innerHTML=ic('undo');$('#redo').innerHTML=ic('redo');setPlayIcon();
addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='Delete'){del()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(e.key==='s'||e.key==='S'){split()}
});
if(window.ResizeObserver){
  new ResizeObserver(()=>{sizeStage();draw()}).observe($('#stage'));
  let lw=0;new ResizeObserver(()=>{const w=sc.clientWidth;if(w&&w!==lw){lw=w;buildTimeline();sc.scrollLeft=t*pps}}).observe(sc);
}

function sampleImage(c1,c2,c3){
  const c=document.createElement('canvas');c.width=720;c.height=1280;
  const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,720,1280);
  gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,720,1280);
  g.fillStyle=c3;g.globalAlpha=.16;
  for(let i=0;i<7;i++){g.beginPath();g.arc(90+i*100,260+(i%3)*340,110+i*16,0,7);g.fill()}
  g.globalAlpha=1;
  return new Promise(res=>{const img=new Image();const u=c.toDataURL('image/jpeg',.8);img.onload=()=>res({el:img,url:u});img.src=u});
}
async function boot(){
  const a=await sampleImage('#0f766e','#0b1220','#3dd6c6'),b=await sampleImage('#4c1d95','#7c2d12','#f5c451');
  const ma=uid(),mb=uid();
  media.set(ma,{kind:'image',el:a.el,url:a.url,thumb:a.url,name:'عينة ١',sample:true});
  media.set(mb,{kind:'image',el:b.el,url:b.url,thumb:b.url,name:'عينة ٢',sample:true});
  S.clips=[
    {id:uid(),m:ma,in:0,out:3,speed:1,vol:1,filter:'none',fit:'cover'},
    {id:uid(),m:mb,in:0,out:2.5,speed:1,vol:1,filter:'vivid',fit:'cover'}
  ];
  S.texts=[{id:uid(),text:'مرحباً بك في مونتاج بدر\nاسحب النص لتحريكه',start:.3,dur:2.6,x:.5,y:.42,size:8,color:'#ffffff',font:'Cairo',bg:false,sample:true}];
  refresh();
  try{await Promise.all(FONTS.map(f=>document.fonts.load(`${f.w} 40px "${f.k}"`,'مرحبا Abc')));draw()}catch(_){}
}
boot();
})();
</script>
